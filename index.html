<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HTTPto · 任意链接 HTTP 终端</title>
<meta name="description" content="网页版 HTTP 请求终端，支持 GET/POST/PUT/PATCH/DELETE 与运行时配置">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230d1117'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='%2339d0d8' font-family='monospace'%3E%3E%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css?v=3&api_v=3">
</head>
<body data-api-v="3">

<div class="app">
  <header class="bar">
    <span class="logo">HTTP<span class="to">to</span></span>
    <span class="meta" id="metaBase" title="当前 base_url">api.github.com</span>
    <span class="meta" id="metaToken" title="token 状态">token 未配置</span>
    <span class="spacer"></span>
    <button class="chip" data-cmd="help" type="button">帮助</button>
    <button class="chip" data-cmd="apis" type="button">速查</button>
    <button class="chip" data-cmd="config" type="button">配置</button>
    <button class="chip" id="btnClear" type="button">清屏</button>
  </header>

  <main id="out" class="out" aria-live="polite"></main>

  <form id="form" class="inputline" autocomplete="off">
    <span class="prompt">&gt;&gt;&gt;</span>
    <input id="cmd" type="text" autocomplete="off" autocapitalize="off"
           autocorrect="off" spellcheck="false" enterkeyhint="send"
           placeholder="GET /user    试试 help">
    <button type="button" id="btnCancel" class="cancel">取消</button>
    <button type="submit" class="send">发送</button>
  </form>
</div>

<script src="js/app.js?v=3&api_v=3"></script>
</body>
</html>
